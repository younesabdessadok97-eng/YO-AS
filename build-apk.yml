name: Unzip and Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: فك ضغط ملف zip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then echo "لم أجد ملف zip في المستودع"; exit 1; fi
          unzip -q "$ZIP" -d unpacked
          CFG=$(find unpacked -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$CFG" ]; then echo "لم أجد capacitor.config.json داخل الملف"; exit 1; fi
          echo "APP_DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: تثبيت المكتبات
        run: cd "$APP_DIR" && npm install

      - name: إنشاء مشروع أندرويد
        run: cd "$APP_DIR" && npx cap add android && npx cap sync android

      - name: بناء APK
        run: cd "$APP_DIR/android" && chmod +x gradlew && ./gradlew assembleDebug

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
